<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Hotel</title>
        <link rel="stylesheet" href="css/estilo.css">
        <style>
               
        form {
            width: 540px;
            margin: 0 auto;
            padding: 35px 50px 40px;
            background:linear-gradient(135deg,#00040e,#021b4b);
            border-radius: 12px;
            box-shadow: 0 8px 20px #ffffff;
            color: aliceblue;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 35px;
            width: 100%;
            padding: 10px;
            background-color: #137a9c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }

       button:hover{
        background-color: #1f055c;
        transform: scale(1.03);

        }

        </style>

</head>
<body style="background-color: lightblue;">

    <h1 style="text-align: center;color: #030108;font-size:60px;">Booking</h1>
    <h2 style="text-align:center;margin-top: 30px;margin-bottom: 35px;color:#222;font-size: 35px;">Cadastro de Hotel</h2>

    <form style="text-align:center;" action="salvar_hotel.php" method="POST">


        <label for="nome">Nome do Hotel:</label><br>
        <input type="text" id="nome" name="nome" placeholder="Digite o nome do hotel." required><br><br>

        <label for="cidade">Cidade:</label><br>
        <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade do hotel." required><br><br>

        <label for="estrelas">Classificação em Estrelas (1 a 5):</label><br>
        <input type="number" id="estrelas" name="estrelas" min="1" max="5" placeholder="" required><br>

        <button>Cadastrar Hotel</button>

    </form>

    <br>
    <a href="index.html">Voltar à página principal</a>

</body>
</html>
