<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CORREÇÃO: A tag <title> não deve ter tags HTML como <h1> dentro dela -->
    <title>cdastro de quartos</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
       form {
            width: 540px;
            margin: 0 auto;
            padding: 35px 50px 40px;
            background:linear-gradient(135deg,#00040e,#021b4b);
            border-radius: 12px;
            box-shadow: 0 8px 20px #ffffff;
            color: aliceblue;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            margin-top: 35px;
            width: 100%;
            padding: 10px;
            background-color: #137a9c;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
        }

       button:hover{
        background-color: #1f055c;
        transform: scale(1.03);

        }
    </style>
</head>
<body style="background-color: rgb(161, 219, 245);">
    <!-- CORREÇÃO: Corrigido o erro de digitação de "Cadrasto" para "Cadastro" -->
     <h1 style="text-align: center;color: #00040e;">Cadastro de quartos</h1>
    
    <div>
        <form action="" method="post">
            <label for="ID_Hotel">ID do Hotel</label>
            <br>
            <!-- CORREÇÃO: Adicionado class="input" para aplicar o estilo CSS -->
            <input type="number" id="ID_Hotel" name="ID_Hotel" class="input" placeholder="ID do Hotel">
            <br><br>

            <label for="numero_quarto">numero do quarto</label>
            <br>
            <input type="number" id="numero_quarto" name="numero_quarto" class="input" placeholder="numero do quarto">
            <br><br>

            <label for="tipo_quarto">Tipo de Quarto</label>
            <br>
            <input type="text" id="tipo_quarto" name="tipo_quarto" class="input" placeholder="tipo de quarto">
            <br><br>

            <label for="preço_diaria">Preço da diaria</label>
            <br>
            <input type="number" id="preço_diaria" name="preço_diaria" class="input" placeholder="preço da diaria" step="0.01">
            <br><br>

            <button type="submit">Cadastrar</button>
            <br><br>
         
        </form>
    </div>
</body>
</html>
