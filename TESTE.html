<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CORREÇÃO: A tag <title> não deve ter tags HTML como <h1> dentro dela -->
    <title>Reserva de Hotéis</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .input {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #ccc;
            color: black;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: rgb(61, 234, 13);
        }
        form {   
            text-align: center;
            border: 4px black solid;
            border-radius: 4px;
            width: 40%;
            /* CORREÇÃO: Mudado de 'O' maiúsculo para o número '0' */
            margin: 0 auto; 
            /* ADICIONADO: Espaço interno para o texto não colar na borda preta */
            padding: 20px; 
        }
        div {
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- CORREÇÃO: Corrigido o erro de digitação de "Cadrasto" para "Cadastro" -->
    <h2 style="text-align: center;">Cadastro de Cliente</h2>
    <div>
        <form action="salvar_cliente.php" method="post">
            <label for="nome">Nome completo</label>
            <br>
            <!-- CORREÇÃO: Adicionado class="input" para aplicar o estilo CSS -->
            <input type="text" id="nome" name="nome" class="input" placeholder="Digite seu nome completo">
            <br><br>

            <label for="email">E-mail</label>
            <br>
            <input type="email" id="email" name="email" class="input" placeholder="Digite seu E-mail">
            <br><br>

            <label for="telefone">Telefone</label>
            <br>
            <input type="tel" id="telefone" name="telefone" class="input" placeholder="Digite seu número de Telefone">
            <br><br>

            <label for="senha">Senha</label>
            <br>
            <input type="password" id="senha" name="senha" class="input" placeholder="Digite sua senha">
            <br><br>

            <button type="submit">Cadastrar</button>
        </form>
    </div>
</body>
</html>
